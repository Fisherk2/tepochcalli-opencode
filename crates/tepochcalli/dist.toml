# cargo-dist config (T18) — Phase 3: wizard `tepochcalli`.
#
# Fuente: https://axodotdev.github.io/cargo-dist/book/reference/config.html
# (`[dist]` con `cargo-dist-version`, `ci`, `installers`, `targets`).
# `cargo-dist-version` = última release a fecha de escritura (2026-10-21).
#
# D-b: Windows queda FUERA de la matriz CI (phase3.yml solo corre
# ubuntu+macos), pero el target `x86_64-pc-windows-msvc` SE compila en el
# release para que el instalador `powershell` exista.
#
# `allow-dirty = ["ci"]`: `.github/workflows/release.yml` está escrito a mano
# (el binario `dist` no está disponible en este entorno) siguiendo la
# estructura de `dist init --ci=github`, con divergencias deliberadas
# (un solo action de terceros + `gh` CLI). Reconciliar con
# `cargo dist generate --check` cuando `dist` esté instalado (T19); M6 sigue
# vigente: este workflow NUNCA se ha ejecutado.

[dist]
cargo-dist-version = "0.33.1"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
checksum = "sha256"
allow-dirty = ["ci"]
