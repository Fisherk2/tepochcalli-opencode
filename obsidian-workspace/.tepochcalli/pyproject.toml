[project]
name = "tepochcalli-flow"
version = "0.1.0"
description = "Tepochcalli RAG flow: incremental CocoIndex pipeline for the Obsidian vault"
requires-python = ">=3.12"
dependencies = [
    # Pins verified by the T1 spike on 2026-10-21 (uv 0.12.9, CPython 3.12.14).
    # Extras are hyphenated; lancedb/pyarrow come from the [lancedb] extra
    # (docs/TRD.md §4: never pin them directly -> avoid version divergence).
    "cocoindex[lancedb,sentence-transformers]==1.0.25",
    # Docling 2.x series, CPU only — no GPU extra (docs/TRD.md §4).
    "docling>=2,<3",
    # Torch: transitive via sentence-transformers/docling, but declared direct
    # so [tool.uv.sources] routes it to the CPU index below — uv ignores source
    # pins on transitive deps (uv 0.12.9; astral-sh/uv#9446). PyPI's Linux
    # wheels drag in the CUDA stack (19 pkgs, ~5 GB) we cannot use (E1: no
    # sm_61 kernels). Direct pin keeps the T1-verified 2.14.1 (docs/TRD.md §3
    # venv budget 1-2 GB). Source: https://docs.astral.sh/uv/concepts/indexes/
    # #pinning-a-package-to-an-index
    "torch==2.14.1",
    # torchvision (via docling-ibm-models): PyPI wheel links against the CUDA
    # torch ABI -> `operator torchvision::nms does not exist` under +cpu; the
    # CPU index ships the matching +cpu build.
    "torchvision==0.29.1",
]

# Only torch/torchvision may resolve from this index; everything else stays on
# PyPI. Source: https://docs.astral.sh/uv/guides/integration/pytorch/
# #using-a-pytorch-index
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# ANN: strict type hints (docs/CODE_STYLE.md). D: docstrings. N: naming.
# I: import sorting. B: bugbear. UP: pyupgrade. E/W/F: pycodestyle+pyflakes.
select = ["E", "W", "F", "I", "ANN", "B", "D", "N", "UP"]
# Conflicting pydocstyle pairs: keep D211 over D203, D212 over D213/D214.
ignore = ["D203", "D213", "D214"]

[tool.pytest.ini_options]
testpaths = [
    "../../tests/unit",
    "../../tests/integration",
    "../../tests/e2e",
]
# Suite de CORRECCION por defecto: los tests `slow` (mediciones de latencia)
# quedan fuera. Es el filtro que docs/WORKFLOW.md §Phase 2/§Testing ya
# prescribe para CI (`pytest -m "not slow"`); ver `tasks/todo.md` T11.
# Para ejecutarlos: `uv run python -m pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: medicion de latencia/bench — no pertenece a la suite de correccion",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "flow"}

[tool.setuptools.packages.find]
where = ["flow"]
