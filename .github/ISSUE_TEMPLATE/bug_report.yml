name: Bug report
description: Report something broken in Tepochcalli (wizard, RAG engine, MCP server, vault).
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug and where it shows up.
      placeholder: When I run `just ci`, the test-mcp-wire suite fails with ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal commands or actions to hit the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, uv/rust versions, install channel (uvx), repo commit.
      placeholder: Linux ...; uv ...; rust ...; uvx tepochcalli 0.1.0-beta.2; commit ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Redact secrets first (API keys, tokens, `.env` contents) — never paste them.
      render: shell
