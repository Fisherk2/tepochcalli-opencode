# CI — gate único de push/PR de Tepochcalli (desde v0.1.0-beta.2).
#
# Composición del gate (aprobada por el dueño, 2026-11-23):
#   * job `python`   — la mitad Python de `just quality` + `test-acceptance` + `md-lint`
#   * job `rust`     — `just rust-ci` (fmt + clippy + test)
#   * job `gitleaks` — escaneo de secretos sobre TODO el historial (en paralelo)
# El lado Rust de `just quality` (clippy/fmt) lo cubre el job `rust`, así que
# clippy y rustfmt corren EXACTAMENTE una vez por corrida (sin doble gate).
#
# Presupuesto: < 10 min wall-clock (requisito duro del dueño) — `timeout-minutes:
# 10` en CADA job es el corte duro. Tiempos medidos que componen el gate:
#   * `python-test-unit` 702 tests / 52-76 s (AGENTS.md:87; 707 tests / 69,45 s
#     medidos en docs/WORKFLOW.md:371)
#   * `test-acceptance` 10 tests / 4 s (AGENTS.md:96)
#   * `rust-ci` 2m45s en caliente (docs/WORKFLOW.md:368-369)
#   * `md-lint` 0 issues sobre 63 ficheros (docs/WORKFLOW.md:372)
# El gate COMPLETO `just ci` (20:58-36:58 medidos, AGENTS.md:91-92) está
# PROHIBIDO en CI por regla del dueño: es una corrida LOCAL de cierre de fase.
# Nota honesta: la PRIMERA corrida sin caches (modelos ~1.6 GB + torch) queda
# fuera del envelope medido; el timeout de 10 min la corta en seco (diseño
# aprobado — el presupuesto es duro, no maquillado).
#
# Triggers: `pull_request` (todas las ramas) + `push` SOLO a develop/main — así
# un PR no dispara dos veces (push + pull_request en cada workflow = 4 corridas
# por PR). Este fichero es el ÚNICO gate del repo: los dos workflows
# provisionales creados durante el desarrollo se eliminaron el 2026-11-24
# (nunca corrieron en GitHub Actions); sus jobs `network`/`smoke` siguen
# disponibles como recetas locales (`just rust-test-nonet`, `just rust-smoke`).
#
# `just` NO viene preinstalado en ubuntu-latest: se instala explícitamente en
# cada job que lo usa (binario musl precompilado, ver paso `Instala just`).

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

# Cancela corridas superseded del mismo ref del workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Toolchain pineada = la del desarrollo local (verificada con `just rust-ci`).
  RUST_TOOLCHAIN: 1.99.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 ⇒ TODAS las ramas y tags. El escaneo va sin
      # `--log-opts`, de modo que gitleaks usa su default
      # `git log -p -U0 --full-history --all` (sources/git.go, v8.24.3):
      # historial completo y EXACTAMENTE el mismo en pull_request y en push.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # gitleaks-action@v2 no sirve como gate de PR aquí: pide los commits con
      # UNA petición sin paginar (GitHub devuelve 30 por página) y escanea
      # `first^..last`. En la PR #1 (480 commits) solo vio los primeros 30
      # (`876a215^..4e8e565`, 2026-11-03..09) y reportó «no leaks found»
      # (run 45334999235), mientras que el push del squash escaneaba
      # `--log-opts=-1` el diff completo de la PR y fallaba con 2 hallazgos
      # (run 45336315490). El binario pineado se ejecuta sin rango por evento.
      - name: Instala gitleaks 8.24.3 (release de GitHub, checksum pineado)
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks-8.24.3.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          printf '%s  %s\n' \
            "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c" \
            "${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          # GITHUB_PATH aplica al SIGUIENTE paso; aquí se verifica en sitio.
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks" version

      # `.gitleaks.toml` (raíz) documenta los falsos positivos verificados sin
      # apagar reglas. Exit 2 = secretos hallados, 1 = error (mismo contrato
      # que la action): el job solo pasa con cero hallazgos.
      - name: Escanea TODO el historial (gitleaks git, sin rango por evento)
        run: gitleaks git --redact --exit-code=2 --verbose .

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # `shell: bash` = `bash --noprofile --norc -eo pipefail` (falla en el
        # primer error de cualquier paso `run`).
        shell: bash
    env:
      # uv 0.12.9 ignora [tool.uv] project-environment: solo env var (Justfile:42).
      UV_PROJECT_ENVIRONMENT: venv
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # setup-uv instala uv 0.12.9 (misma versión pineada en el Justfile) y
      # cachea ~/.cache/uv: `enable-cache` es "auto" por defecto (action.yml de
      # esa revisión) ⇒ activo en pull_request/push sobre runners de GitHub.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.9"

      - name: Instala CPython 3.12 (gestionado por uv)
        # Patrón documentado por setup-uv (FAQ «Do I still need setup-python»):
        # https://github.com/astral-sh/setup-uv#do-i-still-need-actionssetup-python-alongside-setup-uv
        run: uv python install 3.12

      # `~` NO se expande en `env:` de GitHub Actions, por eso se exporta vía
      # $GITHUB_ENV con $HOME resuelto por el shell.
      - name: Fija los caches de modelo FUERA del repo
        run: |
          set -euo pipefail
          {
            echo "HF_HOME=${HOME}/.cache/huggingface"
            echo "SENTENCE_TRANSFORMERS_HOME=${HOME}/.cache/huggingface"
            echo "DOCLING_CACHE_DIR=${HOME}/.cache/docling"
          } >> "${GITHUB_ENV}"

      # Key basado en uv.lock + id del modelo; restore-keys reutiliza blobs
      # previos ante un bump de lock (son content-addressed).
      - name: Cache de modelos (HF + Docling) por revisión pineada
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
          key: models-v1-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2-${{ hashFiles('obsidian-workspace/.tepochcalli/uv.lock') }}
          restore-keys: |
            models-v1-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2-

      # `just` NO está en ubuntu-latest (verificado: hay que instalarlo). El
      # binario musl precompilado de la release es el método más rápido y
      # determinista: `cargo install just` compila ~2 min en frío y `apt` no
      # garantiza versión. Versión 1.59.0 = la del desarrollo local (misma que
      # cita el Justfile:516); checksum fijado para que el paso sea
      # reproducible ante cualquier sorpresa del CDN.
      - name: Instala just (binario musl precompilado, 1.59.0)
        run: |
          set -euo pipefail
          just_ver="1.59.0"
          archive="${RUNNER_TEMP}/just-${just_ver}.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "${archive}" \
            "https://github.com/casey/just/releases/download/${just_ver}/just-${just_ver}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' \
            "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e" \
            "${archive}" | sha256sum --check -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" just
          # GITHUB_PATH aplica al SIGUIENTE paso; aquí se verifica en sitio.
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/just" --version

      - name: uv sync --frozen (deps exactas de uv.lock)
        working-directory: obsidian-workspace/.tepochcalli
        run: uv sync --frozen

      # Mitad Python del gate (recetas del Justfile raíz; en orden y cortando
      # en el primer fallo). NO se invoca `just quality` completo: su mitad
      # Rust (clippy/fmt) la cubre el job `rust`, así clippy y rustfmt corren
      # exactamente una vez por corrida. md-lint usa npx, que ya viene en
      # ubuntu-latest (Node preinstalado).
      - name: Gate Python (lint -> fmt -> tipos -> unit -> aceptación -> md-lint)
        run: just python-lint python-fmt-check python-typecheck python-test-unit test-acceptance md-lint

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Toolchain 1.99.1 pineada con los componentes que exige `just rust-ci`
      # (clippy + rustfmt). Forma coma — `--component` es `Vec<String>` con
      # `value_delimiter = ','`, es decir UN valor por cada aparición del flag:
      # un `rustfmt` separado por espacio cae como argumento posicional de
      # toolchain. Error real corregido en `63ca13a` (2026-11-23):
      # `invalid value 'rustfmt' for '[TOOLCHAIN]...': invalid toolchain name:
      # 'rustfmt'` ⇒ forma correcta `--component clippy,rustfmt`.
      - name: Instala la toolchain Rust pineada
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_TOOLCHAIN}"

      # Mismo paso de `just` que el job python (ver comentario allí).
      - name: Instala just (binario musl precompilado, 1.59.0)
        run: |
          set -euo pipefail
          just_ver="1.59.0"
          archive="${RUNNER_TEMP}/just-${just_ver}.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "${archive}" \
            "https://github.com/casey/just/releases/download/${just_ver}/just-${just_ver}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' \
            "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e" \
            "${archive}" | sha256sum --check -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" just
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/just" --version

      # Mitigación crítica del presupuesto: sin esta cache `rust-ci` compilaba
      # TODO en frío. Registry + git de
      # cargo y CARGO_TARGET_DIR (default del Justfile:304, el mismo que usa
      # `just rust-ci` sin argumentos) rotan con Cargo.lock; restore-keys
      # reutiliza los artefactos previos ante un bump de lock.
      - name: Cache de cargo (registry + git + CARGO_TARGET_DIR)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/opencode/cargo-target
          key: cargo-v1-${{ runner.os }}-${{ hashFiles('crates/tepochcalli/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-

      # fmt + clippy + test (Justfile:382). Sin argumentos: usa el directorio
      # default de CARGO_TARGET_DIR (Justfile:304) — el mismo cacheado arriba.
      - name: just rust-ci (fmt + clippy + test)
        run: just rust-ci
