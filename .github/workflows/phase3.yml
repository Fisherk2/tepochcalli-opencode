# CI del wizard `tepochcalli` (T18) — Phase 3.
#
# Gates (mismo orden que el AC de T18):
#   `cargo fmt --check` → `cargo clippy -D warnings` → `cargo test`
# en `ubuntu-latest` y `macos-latest` (D-b: Windows fuera de la matriz;
# compila en `release.yml`, no se verifica aquí).
#
# Cobertura de los 5 caminos del menú de embedder (D7.1):
#   paths 1-4 (MiniLM default, preset alternativo, ID libre de HF, API
#     externa) ⇒ `cargo test` con `FakeHost` + `FakeHttp`: sin red y sin
#     descargar el modelo de 470 MB en cada corrida (`int_embedder_menu.rs`,
#     `int_presets.rs`);
#   path 5 («configurar después», el default no interactivo) ⇒ ADEMÁS el job
#     `smoke`: instalación real con `--non-interactive --skip-model`
#     (RAG `degraded`, sin índice, sin descargas de modelos).
#
# El smoke usa `--payload` LOCAL (árbol del repo: `pyproject.toml` +
# `uv.lock` + `flow/` + `mcp/`): la red solo se usa para `uv` y `uv sync`,
# nunca para modelos. Verifica `00-Resources/` + `mcp.servers` válido.
#
# M6 (sin cambio): este workflow NUNCA se ha ejecutado en GitHub Actions —
# no se declara «CI verde» en ninguna parte.

name: Phase 3

on:
  push:
  pull_request:

# Igual que `phase1.yml`: la corrida superseded se cancela; push y PR corren
# ambas superficies en paralelo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Misma toolchain que el desarrollo local (verificada con `just rust-ci`).
  RUST_TOOLCHAIN: 1.99.1

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Instala la toolchain Rust pineada
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy rustfmt
          rustup default "${RUST_TOOLCHAIN}"

      # --- Quality gates (fail-fast: el primer fallo corta) ---

      - name: cargo fmt --check
        working-directory: crates/tepochcalli
        run: cargo fmt --check

      - name: cargo clippy -D warnings (lib + bins + tests)
        working-directory: crates/tepochcalli
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test (5 caminos con fakes, sin red ni modelos)
        working-directory: crates/tepochcalli
        run: cargo test --locked

  # Path 5 de punta a punta: VM limpia (sin Python ni Node) → install con
  # payload local → vault con `00-Resources/` + `mcp.servers` válido.
  smoke:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Instala la toolchain Rust pineada
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      # `uv sync` baja ~1 GB en frío (torch CPU): la cache lo deja en minutos.
      - name: Cache de uv (binarios + CPython gestionado)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/python
          key: uv-smoke-v1-${{ runner.os }}-${{ hashFiles('obsidian-workspace/.tepochcalli/uv.lock') }}
          restore-keys: |
            uv-smoke-v1-${{ runner.os }}-

      - name: Compila el wizard (debug; el release lo compila `release.yml`)
        working-directory: crates/tepochcalli
        run: cargo build --locked

      # Payload local mínimo con el proyecto Python real: sin él F5 no
      # tendría `pyproject.toml` + `uv.lock` que sincronizar (T19 lo
      # sustituye por el asset versionado).
      - name: Prepara el payload local
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/smoke/payload/.tepochcalli"
          mkdir -p "${payload}"
          cp obsidian-workspace/.tepochcalli/pyproject.toml \
            obsidian-workspace/.tepochcalli/uv.lock \
            "${payload}/"
          cp -r obsidian-workspace/.tepochcalli/flow \
            obsidian-workspace/.tepochcalli/mcp \
            "${payload}/"

      - name: Install path-5 (default no interactivo, sin modelos)
        run: |
          set -euo pipefail
          ./crates/tepochcalli/target/debug/tepochcalli install \
            --non-interactive --skip-model \
            --vault "${RUNNER_TEMP}/smoke/vault" \
            --payload "${RUNNER_TEMP}/smoke/payload"

      - name: Verifica el vault instalado
        run: |
          set -euo pipefail
          vault="${RUNNER_TEMP}/smoke/vault"
          test -f "${vault}/00-Resources/ejemplo.md"
          test -f "${vault}/00-Resources/ejemplo.pdf"
          grep -q '"tepochcalli-rag"' "${vault}/opencode.json"
